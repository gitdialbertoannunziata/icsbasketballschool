name: Build e deploy (Azure Static Web Apps)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm --prefix api ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build && npm --prefix api run build

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      # Build fatta qui e non da Oryx: con app_location "/" l'action caricava l'intera
      # radice (node_modules compreso) e Azure rifiutava il deploy per troppi file statici.
      # Le dipendenze dell'API servono anche al typecheck del sito (gli script importano api/src/lib).
      - name: Installa dipendenze
        run: npm ci && npm --prefix api ci
      - name: Build
        run: npm run build && npm --prefix api run build
      - name: Rimuovi dipendenze di sviluppo dell'API
        run: npm --prefix api prune --omit=dev
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          config_file_location: /
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Chiudi ambiente di preview
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
